# Catálogo do gateway: provedores, POOL de modelos e ROTAS.
#
# Roteamento inteligente (gw/roteador.py): a cada pedido numa rota, o gateway
# ordena os modelos da rota por
#   nota de qualidade (benchmarks do catálogo Routeway → qualidade.json, ou nota manual)
#   × velocidade medida (latência real das últimas chamadas)
#   × confiabilidade medida (sucesso/erro), tirando quem está em espera após erro,
#     quem estourou a cota do dia e quem não serve para o pedido
#     (pedido com ferramenta só vai para modelo que PROVOU tool call; imagem só
#     para visao; prompt maior que o contexto fica de fora).
# O 1º vira o modelo; os 3 seguintes, o fallback daquele pedido.
#
# Perfis (peso qualidade / velocidade): qualidade 85/15, equilibrado 60/40, velocidade 25/75.
# Fontes (03/11/2026): catálogos com chave de Routeway, NVIDIA, Groq e OpenRouter;
# contexto e capacidades do catálogo Routeway. NVIDIA não publica o teto do tier grátis.

provedores:
  routeway:
    prefixo: openai
    chave: GW_ROUTEWAY_KEY
    api_base: https://api.routeway.ai/v1
    cadastro: https://routeway.ai/dashboard/keys
    rpd: 200          # modelos :free, por conta
    rpm: 5
  nvidia:
    prefixo: nvidia_nim
    chave: GW_NVIDIA_KEY
    api_base: https://integrate.api.nvidia.com/v1
    cadastro: https://build.nvidia.com/settings/api-keys
    rpm: 40
    timeout: 10       # o LiteLLM repete 3x por dentro na NVIDIA: ~30 s reais
  openrouter:
    prefixo: openrouter
    chave: GW_OPENROUTER_KEY
    api_base: https://openrouter.ai/api/v1
    cadastro: https://openrouter.ai/settings/keys
    rpd: 50           # :free sem crédito (1.000 com US$10)
    rpm: 20
  groq:
    prefixo: groq
    chave: GW_GROQ_KEY
    api_base: https://api.groq.com/openai/v1
    cadastro: https://console.groq.com/keys
    rpm: 30
    velocidade: 0.9   # palpite inicial até medir (Groq é LPU)
  cerebras:
    # 07/2026: deixou de ser grátis (trial de US$5 com cartão, 30 dias). Fica só se você tiver chave.
    prefixo: cerebras
    chave: GW_CEREBRAS_KEY
    api_base: https://api.cerebras.ai/v1
    cadastro: https://cloud.cerebras.ai
    rpm: 30
    velocidade: 0.9
  # --- adicionados 05/11/2026 (pesquisa de planos grátis; sem chave no .env = fora, sem erro)
  gemini:
    # Google AI Studio, endpoint compatível com OpenAI. Sem cartão, funciona no Brasil.
    # Limite não publicado (aparece no AI Studio por projeto); grátis usa os dados (a máscara cobre).
    prefixo: openai
    chave: GW_GEMINI_KEY
    api_base: https://generativelanguage.googleapis.com/v1beta/openai/
    cadastro: https://aistudio.google.com/apikey
  zai:
    # Z.ai: glm-4.7-flash grátis por token. Usar a chave da API padrão (não a do Coding Plan).
    prefixo: openai
    chave: GW_ZAI_KEY
    api_base: https://api.z.ai/api/paas/v4
    cadastro: https://z.ai/manage-apikey/apikey-list
  cloudflare:
    # Workers AI: 10.000 neurons/dia (zera 00:00 UTC). URL leva o account id:
    # GW_CLOUDFLARE_URL=https://api.cloudflare.com/client/v4/accounts/<account_id>/ai/v1
    prefixo: openai
    chave: GW_CLOUDFLARE_KEY
    api_base_env: GW_CLOUDFLARE_URL
    cadastro: https://dash.cloudflare.com/profile/api-tokens
  kilo:
    # Kilo AI Gateway: modelos :free funcionam SEM conta (200 req/hora por IP, testado 05/11).
    # GW_KILO_KEY (app.kilo.ai/profile) é opcional e só aumenta a cota.
    prefixo: openai
    chave: GW_KILO_KEY
    anonimo: true
    api_base: https://api.kilo.ai/api/gateway
    cadastro: https://app.kilo.ai/profile
  hetzner:
    # Hetzner Inference (experimental, grátis enquanto durar): 10 req/min por chave, 4M tokens
    # de entrada por minuto. Conta Hetzner (pode pedir cartão, sem cobrança).
    prefixo: openai
    chave: GW_HETZNER_KEY
    api_base: https://inference.hetzner.com/api/v1
    cadastro: https://experiments.hetzner.com/inference
    rpm: 10
  local:
    # llamafile/servidor local já rodando; o gateway NÃO sobe modelo.
    prefixo: openai
    chave: null
    api_base_env: GW_LOCAL_URL

